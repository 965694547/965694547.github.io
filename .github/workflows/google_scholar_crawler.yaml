name: Update Google Scholar citations

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:
  push:
    paths:
      - "google_scholar_crawler/**"

permissions:
  contents: write

concurrency:
  group: scholar-crawl
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Crawl Google Scholar profile
        continue-on-error: true
        env:
          GOOGLE_SCHOLAR_ID: LHzzlAgAAAAJ
        run: |
          cd google_scholar_crawler
          python main.py 2>&1 | tee crawl_output.txt
          exit ${PIPESTATUS[0]}

      - name: Commit refreshed data
        if: always() && hashFiles('google_scholar_crawler/results/gs_data.json') != ''
        run: |
          mkdir -p google-scholar-stats
          cp google_scholar_crawler/results/gs_data.json google-scholar-stats/gs_data.json
          cp google_scholar_crawler/results/gs_data_shieldsio.json google-scholar-stats/gs_data_shieldsio.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add google-scholar-stats
          if git diff --staged --quiet; then
            echo "No citation changes."
          else
            git commit -m "chore: refresh Google Scholar citation data"
            git push
          fi

      # a dedicated orphan branch keeps the site history clean and gives
      # jsDelivr/shields.io a permanent URL that never needs a redeploy:
      #   https://cdn.jsdelivr.net/gh/<user>/<repo>@google-scholar-stats/gs_data_shieldsio.json
      # It also always carries the crawl log + diag info, so any failure can be
      # read remotely without needing repo admin rights.
      - name: Publish data to the google-scholar-stats branch
        if: always()
        run: |
          set -e
          TMP=$(mktemp -d)
          cp google_scholar_crawler/results/*.json "$TMP/" 2>/dev/null || true
          cp google_scholar_crawler/crawl_output.txt "$TMP/" 2>/dev/null || true
          {
            echo "run: ${GITHUB_RUN_ID} attempt: ${GITHUB_RUN_ATTEMPT}"
            date -u
            echo "--- ls google_scholar_crawler"
            ls -la google_scholar_crawler || true
            echo "--- ls google_scholar_crawler/results"
            ls -la google_scholar_crawler/results 2>/dev/null || echo "(no results dir)"
            echo "--- pip freeze (top)"
            pip freeze | head -5
          } > "$TMP/diag.txt"
          ls -la "$TMP"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan scholar-data-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp "$TMP"/* .
          git add -A
          git commit -m "data: $(date -u +%FT%TZ)" || exit 0
          git push -f origin scholar-data-tmp:google-scholar-stats
